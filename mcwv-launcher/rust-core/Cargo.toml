[package]
name = "mcwv-core"
version = "1.0.0"
edition = "2021"

[lib]
name = "mcwv_core"
crate-type = ["staticlib"]

[dependencies]
sha2 = "0.10"
hmac = "0.12"
# Removed serde/serde_json/base64 — they pull std networking which needs ws2_32/ntdll
# Only need sha2+hmac for HWID/HMAC, no extra deps

[profile.release]
panic = "abort"
lto = true
opt-level = "z"
strip = true
