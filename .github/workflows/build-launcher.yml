name: Build MCWV Launcher EXE

on:
  push:
    paths:
      - 'mcwv-launcher/**'
      - '.github/workflows/build-launcher.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check if mcwv-launcher folder exists
        shell: bash
        run: |
          ls -la
          if [ ! -d "mcwv-launcher" ]; then
            echo "❌ mcwv-launcher folder NOT FOUND in repo!"
            echo "You need to upload mcwv-launcher/ folder first:"
            echo "- mcwv-launcher/src/main.cpp"
            echo "- mcwv-launcher/rust-core/src/lib.rs"
            echo "- mcwv-launcher/rust-core/Cargo.toml"
            echo "- mcwv-launcher/CMakeLists.txt"
            exit 1
          fi
          echo "✅ mcwv-launcher folder exists"
          ls -la mcwv-launcher/
          ls -la mcwv-launcher/rust-core/ || echo "rust-core missing"
          ls -la mcwv-launcher/src/ || echo "src missing"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28'

      - name: Build Rust core
        shell: bash
        run: |
          cd mcwv-launcher/rust-core
          cargo build --release
          ls -lh target/release/ | grep mcwv || ls -lh target/release/

      - name: Build C++ launcher
        shell: bash
        run: |
          cd mcwv-launcher
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -G "Visual Studio 17 2022" -A x64
          cmake --build build --config Release --verbose
          ls -lh build/Release/

      - name: Get SHA256
        shell: bash
        run: |
          cd mcwv-launcher
          sha256sum build/Release/MCWV-Launcher.exe || certutil -hashfile build/Release/MCWV-Launcher.exe SHA256
          echo "EXE built: $(ls -lh build/Release/MCWV-Launcher.exe)"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: MCWV-Launcher.exe
          path: mcwv-launcher/build/Release/MCWV-Launcher.exe
          retention-days: 30
          if-no-files-found: error
