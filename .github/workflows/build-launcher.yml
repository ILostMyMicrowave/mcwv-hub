name: Build MCWV Launcher v1.0.1 CLEAN (no WMI)
on:
  push:
    branches: [main, master]
    paths: ['src/**', '.github/workflows/build-launcher.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build CLEAN launcher (no WMI)
        shell: cmd
        run: |
          cd src
          cl /EHsc /O2 /DUNICODE /D_UNICODE /DWIN32_LEAN_AND_MEAN main-clean.cpp version.rc /Fe:MCWV-Launcher.exe /link winhttp.lib crypt32.lib shell32.lib
          findstr /I "Win32_Processor Win32_BaseBoard Win32_DiskDrive Wbem" MCWV-Launcher.exe && echo BAD STILL HAS WMI && exit 1 || echo CLEAN - no WMI found
      - name: SHA256
        shell: pwsh
        run: |
          cd src
          $hash = (Get-FileHash MCWV-Launcher.exe -Algorithm SHA256).Hash
          $size = (Get-Item MCWV-Launcher.exe).Length
          "$hash" | Out-File -Encoding ascii sha256.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MCWV-Launcher-v1.0.1-CLEAN
          path: src/MCWV-Launcher.exe
