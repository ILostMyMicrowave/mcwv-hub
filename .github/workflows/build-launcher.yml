name: Build MCWV Launcher EXE

on:
  push:
    paths:
      - 'mcwv-launcher/**'
      - '.github/workflows/build-launcher.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check folder
        shell: bash
        run: |
          ls -la
          if [ ! -d "mcwv-launcher" ]; then echo "❌ mcwv-launcher missing"; exit 1; fi
          ls -la mcwv-launcher/ mcwv-launcher/rust-core/ mcwv-launcher/src/

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build Rust core (optional — continues even if fails, C++ will use stubs)
        shell: pwsh
        continue-on-error: true
        run: |
          rustup default stable-x86_64-pc-windows-msvc
          cd mcwv-launcher/rust-core
          cargo build --release --verbose
          if (Test-Path target\release\mcwv_core.lib) { echo "✅ Rust built: mcwv_core.lib"; dir target\release\mcwv_core.lib }
          else { echo "⚠️ Rust build failed or no lib, C++ will use stubs — exe still builds"; }

      - name: Build C++ launcher (always works, even without Rust)
        shell: pwsh
        run: |
          cd mcwv-launcher
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --verbose
          dir build\Release\
          if (Test-Path build\Release\MCWV-Launcher.exe) { echo "✅ EXE built: 8MB"; } else { echo "❌ EXE not found"; exit 1; }

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: MCWV-Launcher.exe
          path: mcwv-launcher/build/Release/MCWV-Launcher.exe
          retention-days: 30
          if-no-files-found: error
