name: Build MCWV Launcher EXE

on:
  push:
    paths:
      - 'mcwv-launcher/**'
      - '.github/workflows/build-launcher.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check folder exists
        shell: bash
        run: |
          if [ ! -d "mcwv-launcher" ]; then echo "❌ mcwv-launcher missing"; exit 1; fi
          ls -la mcwv-launcher/

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup MSVC dev cmd
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build Rust core (pwsh — fixes Git link.exe shadowing MSVC link.exe)
        shell: pwsh
        run: |
          rustup default stable-x86_64-pc-windows-msvc
          cd mcwv-launcher/rust-core
          cargo build --release --verbose
          dir target\release\ | Select-String mcwv

      - name: Build C++ launcher
        shell: pwsh
        run: |
          cd mcwv-launcher
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --verbose
          dir build\Release\

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: MCWV-Launcher.exe
          path: mcwv-launcher/build/Release/MCWV-Launcher.exe
          retention-days: 30
          if-no-files-found: error
