name: Build MCWV Launcher EXE

on:
  push:
    paths:
      - 'mcwv-launcher/**'
      - '.github/workflows/build-launcher.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check folder exists
        shell: bash
        run: |
          if [ ! -d "mcwv-launcher" ]; then echo "❌ mcwv-launcher missing"; exit 1; fi
          ls -la mcwv-launcher/
          ls -la mcwv-launcher/rust-core/
          ls -la mcwv-launcher/src/

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup MSVC dev cmd (fixes VS not found)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build Rust core
        shell: bash
        run: |
          cd mcwv-launcher/rust-core
          cargo build --release
          ls -lh target/release/ | grep -i mcwv || ls -lh target/release/

      - name: Build C++ launcher (auto generator, no VS flag)
        shell: bash
        run: |
          cd mcwv-launcher
          # Auto-detect generator (no -G flag) — works with msvc-dev-cmd
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --verbose
          ls -lh build/Release/

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: MCWV-Launcher.exe
          path: mcwv-launcher/build/Release/MCWV-Launcher.exe
          retention-days: 30
          if-no-files-found: error
